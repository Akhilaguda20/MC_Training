AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: User CRUD API with Granular IAM

Globals:
  Function:
    Runtime: python3.9
    Timeout: 10
    MemorySize: 128

Resources:

  ## 🔸 DynamoDB Table
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-users"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  ## 🔸 CREATE USER
  CreateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-create-user"
      Handler: createUser.handler.lambda_handler
      CodeUri: src/
      Environment:
        Variables:
          TABLE_NAME: !Ref UsersTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt UsersTable.Arn
      Events:
        CreateApi:
          Type: Api
          Properties:
            Path: /users
            Method: post

  ## 🔸 GET USER
  GetUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-get-user"
      Handler: getUser.handler.lambda_handler
      CodeUri: src/
      Environment:
        Variables:
          TABLE_NAME: !Ref UsersTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt UsersTable.Arn
      Events:
        GetApi:
          Type: Api
          Properties:
            Path: /users/{id}
            Method: get

  ## 🔸 UPDATE USER
  UpdateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-update-user"
      Handler: updateUser.handler.lambda_handler
      CodeUri: src/
      Environment:
        Variables:
          TABLE_NAME: !Ref UsersTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt UsersTable.Arn
      Events:
        UpdateApi:
          Type: Api
          Properties:
            Path: /users/{id}
            Method: put

  ## 🔸 DELETE USER
  DeleteUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-delete-user"
      Handler: deleteUser.handler.lambda_handler
      CodeUri: src/
      Environment:
        Variables:
          TABLE_NAME: !Ref UsersTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DeleteItem
              Resource: !GetAtt UsersTable.Arn
      Events:
        DeleteApi:
          Type: Api
          Properties:
            Path: /users/{id}
            Method: delete

Outputs:
  ApiBaseUrl:
    Description: API Gateway Base URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"